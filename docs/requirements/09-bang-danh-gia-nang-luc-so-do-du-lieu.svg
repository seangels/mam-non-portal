<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ luồng dữ liệu Bảng đánh giá năng lực</title>
  <desc id="desc">AssessmentSheet không còn tạo Google Sheet riêng F01. Dữ liệu latest được nạp từ F0, PDF được render từ UI và upload Drive, kết quả cuối ghi về F0.ĐG.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <style>
      .box { fill:#eef5ff; stroke:#3a6ea5; stroke-width:2; rx:12; }
      .sheet { fill:#e7f6e7; stroke:#4a9c4a; stroke-width:2; rx:12; }
      .action { fill:#fff7df; stroke:#d79b00; stroke-width:2; rx:12; }
      .pdf { fill:#fff0f4; stroke:#c44d6d; stroke-width:2; }
      .text { font-family: Arial, sans-serif; font-size:16px; fill:#1f2d3d; }
      .small { font-family: Arial, sans-serif; font-size:13px; fill:#34495e; }
      .muted { font-family: Arial, sans-serif; font-size:13px; fill:#6b7785; }
      .arrow { stroke:#34495e; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .legacy { fill:#f7f7f7; stroke:#9aa1a9; stroke-width:2; stroke-dasharray:7 5; rx:12; }
    </style>
  </defs>

  <text x="40" y="42" class="text" font-weight="700">AssessmentSheet — luồng dữ liệu hiện hành</text>

  <rect x="40" y="80" width="245" height="92" class="sheet"/>
  <text x="60" y="112" class="text">F0 Google Sheet nguồn</text>
  <text x="60" y="138" class="small">_data_DG / _data_DG_only_item</text>

  <rect x="360" y="80" width="230" height="92" class="action"/>
  <text x="386" y="112" class="text">Nạp lại</text>
  <text x="386" y="138" class="small">sync-assessments</text>
  <text x="386" y="158" class="small">Teacher/Admin/SuperAdmin</text>

  <rect x="670" y="80" width="300" height="92" class="box"/>
  <text x="690" y="112" class="text">Latest mirror</text>
  <text x="690" y="138" class="small">AssessmentSheetLatest</text>
  <text x="690" y="158" class="small">AssessmentRecordLatest — chỉ đọc</text>

  <path d="M285 126 H360" class="arrow"/>
  <path d="M590 126 H670" class="arrow"/>

  <rect x="140" y="245" width="310" height="110" class="action"/>
  <text x="164" y="278" class="text">Tạo / sửa AssessmentSheet</text>
  <text x="164" y="305" class="small">PlanGrade + PlanNote</text>
  <text x="164" y="326" class="small">FinalGrade + FinalNote độc lập</text>

  <path d="M750 172 C700 220 560 250 450 285" class="arrow"/>

  <rect x="545" y="235" width="250" height="72" class="action"/>
  <text x="570" y="265" class="text">Preview kế hoạch</text>
  <text x="570" y="290" class="small">HTML/A4 + html2pdf.js</text>

  <rect x="545" y="340" width="250" height="72" class="action"/>
  <text x="570" y="370" class="text">Preview kết quả</text>
  <text x="570" y="395" class="small">HTML/A4 + html2pdf.js</text>

  <path d="M450 285 H545" class="arrow"/>
  <path d="M450 320 C490 354 515 376 545 376" class="arrow"/>

  <polygon points="880,235 1080,235 1110,270 1080,305 880,305" class="pdf"/>
  <text x="905" y="266" class="text">F02 PDF kế hoạch</text>
  <text x="905" y="290" class="small">PlanGrade / PlanNote</text>

  <polygon points="880,340 1080,340 1110,375 1080,410 880,410" class="pdf"/>
  <text x="905" y="371" class="text">F03 PDF kết quả</text>
  <text x="905" y="395" class="small">FinalGrade / FinalNote</text>

  <path d="M795 270 H880" class="arrow"/>
  <path d="M795 376 H880" class="arrow"/>

  <rect x="825" y="485" width="280" height="82" class="sheet"/>
  <text x="850" y="516" class="text">Drive folder học sinh</text>
  <text x="850" y="542" class="small">Student.DriveFolderId</text>

  <path d="M995 305 V485" class="arrow"/>
  <path d="M995 410 V485" class="arrow"/>

  <rect x="140" y="455" width="250" height="82" class="action"/>
  <text x="165" y="486" class="text">Cập nhật kết quả</text>
  <text x="165" y="512" class="small">submit-results + AuditLog</text>

  <rect x="465" y="455" width="260" height="82" class="sheet"/>
  <text x="490" y="486" class="text">F0.ĐG</text>
  <text x="490" y="512" class="small">FinalGrade + FinalNote</text>

  <path d="M300 355 V455" class="arrow"/>
  <path d="M390 496 H465" class="arrow"/>
  <path d="M595 455 C580 310 420 190 285 145" class="arrow"/>

  <rect x="40" y="575" width="660" height="42" class="legacy"/>
  <text x="60" y="602" class="muted">Legacy removed: không còn tạo/copy Google Sheet riêng [F01], không dùng AssessmentSheetSpreadsheetId trong API/UI v1.</text>
</svg>
