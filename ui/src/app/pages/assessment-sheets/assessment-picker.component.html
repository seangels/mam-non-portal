<section class="assessment-picker" aria-labelledby="assessment-picker-heading">
  <section class="dx-card filter-card assessment-picker-filter" aria-labelledby="assessment-picker-filter-heading">
    <button class="filter-toggle" type="button" (click)="filtersExpanded = !filtersExpanded"
      [attr.aria-expanded]="filtersExpanded" aria-controls="assessment-picker-filters">
      <span id="assessment-picker-filter-heading">Bộ lọc mục đánh giá</span>
      <span aria-hidden="true">{{ filtersExpanded ? '−' : '+' }}</span>
    </button>

    <div *ngIf="filtersExpanded" id="assessment-picker-filters" class="filters assessment-picker-filters">
      <div class="filter-row inputs-row">
        <dx-tag-box
          class="latest-grade-input"
          [(value)]="latestGradeFilters"
          [dataSource]="latestGradeOptions"
          valueExpr="value"
          displayExpr="text"
          placeholder="Kết quả gần nhất"
          [showClearButton]="true"
          [showSelectionControls]="true"
          [multiline]="false"
          noDataText="Không có kết quả phù hợp"
          [inputAttr]="latestGradeInputAttr"
          (onValueChanged)="onLatestGradeFiltersChanged()">
        </dx-tag-box>

        <dx-text-box
          class="search-input"
          [(value)]="search"
          valueChangeEvent="input"
          placeholder="Mã, tên"
          [showClearButton]="true"
          [inputAttr]="searchInputAttr"
          (onValueChanged)="scheduleSearch()"
          (onEnterKey)="applyFilters()">
        </dx-text-box>


        <dx-select-box
          class="lv1-input"
          [(value)]="groupLv1Name"
          [dataSource]="groupLv1DataSource"
          valueExpr="name"
          [displayExpr]="groupDisplay"
          [searchEnabled]="true"
          searchMode="contains"
          [placeholder]="groupLv1Placeholder"
          [showClearButton]="true"
          noDataText="Không có nhóm phù hợp"
          [inputAttr]="groupLv1InputAttr"
          (onValueChanged)="onGroupLv1Changed()">
        </dx-select-box>

        <dx-select-box
          class="lv2-input"
          [(value)]="groupLv2Name"
          [dataSource]="groupLv2DataSource"
          valueExpr="name"
          [displayExpr]="groupDisplay"
          [searchEnabled]="true"
          searchMode="contains"
          [placeholder]="groupLv2Placeholder"
          [showClearButton]="true"
          noDataText="Không có nhóm phù hợp"
          [inputAttr]="groupLv2InputAttr"
          (onValueChanged)="onGroupLv2Changed()">
        </dx-select-box>

        <dx-select-box
          class="lv3-input"
          [(value)]="groupLv3Name"
          [dataSource]="groupLv3DataSource"
          valueExpr="name"
          [displayExpr]="groupDisplay"
          [searchEnabled]="true"
          searchMode="contains"
          [placeholder]="groupLv3Placeholder"
          [showClearButton]="true"
          noDataText="Không có nhóm phù hợp"
          [inputAttr]="groupLv3InputAttr"
          (onValueChanged)="onGroupLv3Changed()">
        </dx-select-box>
      </div>

      <div class="filter-row buttons-row">
        <label *ngIf="isSelectMode" class="select-all-checkbox">
          <input
            type="checkbox"
            [checked]="selectAllVisibleChecked"
            [indeterminate]="selectAllVisibleIndeterminate"
            [disabled]="visibleAssessmentIds.length === 0"
            aria-label="Chọn tất cả mục đánh giá đang hiển thị"
            (change)="onSelectAllVisibleChanged($event)" />
          <span>{{ selectAllVisibleText }}</span>
        </label>
        <dx-select-box
          *ngIf="isSelectMode"
          class="view-mode-input"
          [(value)]="viewMode"
          [dataSource]="viewModeOptions"
          valueExpr="value"
          displayExpr="text"
          [searchEnabled]="false"
          [showClearButton]="false"
          [inputAttr]="viewModeInputAttr"
          (onValueChanged)="onViewModeChanged()">
        </dx-select-box>

        <dx-button
          text="Đặt lại"
          icon="revert"
          stylingMode="outlined"
          hint="Xóa toàn bộ bộ lọc (panel + lưới)"
          (onClick)="resetFilters()">
        </dx-button>

        <dx-button
          text="Đặt lại lọc lưới"
          icon="clearformat"
          stylingMode="outlined"
          hint="Đưa filter row + header filter của lưới về mặc định (Kết quả: trừ Đạt +)"
          (onClick)="resetGridFilters()">
        </dx-button>

        <dx-button
          text="Ẩn/Hiện cột"
          icon="column-chooser"
          stylingMode="outlined"
          hint="Ẩn/Hiện cột"
          (onClick)="showDialogColumnChooser()">
        </dx-button>
      </div>
    </div>
  </section>

  <div *ngIf="loadError" class="picker-error" role="alert">
    <span>{{ loadError }}</span>
    <dx-button text="Thử lại" icon="refresh" stylingMode="outlined" (onClick)="retryLoad()"></dx-button>
  </div>

  <div class="dx-card assessment-picker-grid">
    <dx-data-grid
      #grid
      [dataSource]="filteredAssessments"
      [remoteOperations]="gridRemoteOperations"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [columnHidingEnabled]="true"
      [allowColumnResizing]="true"
      columnResizingMode="widget"
      [allowColumnReordering]="true"
      [wordWrapEnabled]="true"
      [rowAlternationEnabled]="true"
      [hoverStateEnabled]="true"
      (onContentReady)="onContentReady()"
      (onRowPrepared)="onRowPrepared($event)"
      noDataText="Không có mục đánh giá phù hợp"
      >
      <dxo-load-panel [enabled]="true" text="Đang tải ..."></dxo-load-panel>
      <dxo-paging [pageSize]="gridDefaultPageSize"></dxo-paging>
      <dxo-pager [showInfo]="true" [showPageSizeSelector]="true" [allowedPageSizes]="gridPageSizes"></dxo-pager>
      <dxo-sorting mode="single"></dxo-sorting>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>

      <dxi-column
        [visible]="isSelectMode"
        caption=""
        cellTemplate="selectCell"
        [width]="52"
        [fixed]="true"
        fixedPosition="left"
        [allowSorting]="false"
        [allowHiding]="false"
        [allowResizing]="false"
        [allowReordering]="false"
        [allowFiltering]="false"
        [allowHeaderFiltering]="false"
        [showInColumnChooser]="false">
      </dxi-column>
      <dxi-column
        [visible]="isAddMode"
        caption="Thao tác"
        cellTemplate="addCell"
        [width]="110"
        [fixed]="true"
        fixedPosition="left"
        [allowSorting]="false"
        [allowHiding]="false"
        [allowResizing]="false"
        [allowReordering]="false"
        [allowFiltering]="false"
        [allowHeaderFiltering]="false"
        [showInColumnChooser]="false">
      </dxi-column>

      <dxi-column dataField="name" caption="Nội dung" [minWidth]="240" [allowHeaderFiltering]="false"></dxi-column>
      <dxi-column dataField="latestGrade" caption="Kết quả gần nhất" [width]="140"
        [calculateCellValue]="latestGradeColumnCalculateCellValue" [filterValues]="latestGradeColumnDefaultFilter"
        [allowSorting]="true"></dxi-column>
      <dxi-column [visible]="false" dataField="latestNote" caption="Ghi chú gần nhất" [minWidth]="180" [allowHeaderFiltering]="false"></dxi-column>
      <dxi-column dataField="groupLv3Name" caption="Nhóm 3" [minWidth]="150" [width]="190"></dxi-column>
      <dxi-column dataField="groupLv2Name" caption="Nhóm 2" [minWidth]="140" [width]="170"
        [headerFilter]="groupLv2HeaderFilter"></dxi-column>
      <dxi-column dataField="groupLv1Name" caption="Nhóm tuổi" [minWidth]="120" [width]="150"></dxi-column>
      <dxi-column [visible]="false" dataField="code" caption="Mã" [width]="90"></dxi-column>
      <dxi-column [visible]="false" dataField="rowIndex" caption="RowIndex" [width]="100"></dxi-column>
      <div *dxTemplate="let cell of 'selectCell'" class="select-cell">
        <dx-check-box
          [value]="isSelected(cell.data.id)"
          [hint]="selectCheckboxHint(cell.data)"
          (onValueChanged)="onSelectCheckboxChanged(cell.data.id, $event)">
        </dx-check-box>
      </div>
      <div *dxTemplate="let cell of 'addCell'" class="add-cell">
        <dx-button
          *ngIf="!isExistingAssessment(cell.data)"
          icon="add"
          type="default"
          stylingMode="text"
          [disabled]="addDisabled"
          [hint]="addButtonHint(cell.data)"
          (onClick)="onAddAssessmentClick(cell.data)">
        </dx-button>
        <dx-button
          *ngIf="isExistingAssessment(cell.data)"
          icon="trash"
          type="danger"
          stylingMode="text"
          [disabled]="addDisabled"
          [hint]="removeButtonHint(cell.data)"
          (onClick)="onRemoveAssessmentClick(cell.data)">
        </dx-button>
      </div>
    </dx-data-grid>
  </div>
</section>
